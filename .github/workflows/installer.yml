name: installer check
# Runs the double-click installers exactly as a user's computer would (from a fresh checkout,
# like the downloaded ZIP), then the tests inside the installed environment.
on:
  push:
    paths: ["install_mac.command", "install_windows.bat", "tools/install_windows.ps1", "pyproject.toml",
            ".github/workflows/installer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Virtual screen with OpenGL for the viewer (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-image0 libdbus-1-3
      - name: Executable flag survives (double-click needs it)
        run: test -x install_mac.command
      - name: Run installer
        timeout-minutes: 15
        run: ./install_mac.command --yes --prefix "$RUNNER_TEMP/ag"
      - name: App launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          plutil -lint "$HOME/Applications/autogel.app/Contents/Info.plist"
          test -x "$HOME/Applications/autogel.app/Contents/MacOS/autogel"
          cat "$HOME/Applications/autogel.app/Contents/MacOS/autogel"
      - name: Installed program works
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/ag/venv/bin/autogel" ladders NEB
          "$RUNNER_TEMP/ag/venv/bin/python" -c "from autogel import markers; n, _ = markers.update_library(); print('library update', n)"
      - name: Core tests in the installed environment
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/ag/venv/bin/python" -m pip install -q pytest
          "$RUNNER_TEMP/ag/venv/bin/python" -m pytest -q --ignore=tests/test_gui.py
      - name: GUI tests (Linux, virtual screen)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: xvfb-run -a -s "-screen 0 1600x1200x24" "$RUNNER_TEMP/ag/venv/bin/python" -m pytest -v tests/test_gui.py
      - name: GUI tests (macOS window server)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/ag/venv/bin/python" -m pytest -v tests/test_gui.py'
      - name: Uninstaller
        if: always()
        run: |
          "$RUNNER_TEMP/ag/Uninstall autogel.command"
          test ! -e "$RUNNER_TEMP/ag"
          test ! -e "$HOME/Applications/autogel.app"
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run installer
        shell: cmd
        run: echo.| install_windows.bat -InstallDir "%RUNNER_TEMP%\ag" -NoShortcut -Yes
      - name: Installed program works
        shell: cmd
        run: '"%RUNNER_TEMP%\ag\venv\Scripts\autogel.exe" ladders NEB'
