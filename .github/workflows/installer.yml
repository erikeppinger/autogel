name: installer check
# Runs the double-click installers exactly as a user's computer would (from a fresh checkout,
# like the downloaded ZIP), then the test suite inside the installed environment.
on:
  push:
    paths: ["install_mac.command", "install_windows.bat", "tools/install_windows.ps1", "pyproject.toml",
            ".github/workflows/installer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3
      - name: Executable flag survives (double-click needs it)
        run: test -x install_mac.command
      - name: Run installer
        run: ./install_mac.command --yes --prefix "$RUNNER_TEMP/ag"
      - name: App launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          plutil -lint "$HOME/Applications/autogel.app/Contents/Info.plist"
          test -x "$HOME/Applications/autogel.app/Contents/MacOS/autogel"
          cat "$HOME/Applications/autogel.app/Contents/MacOS/autogel"
      - name: Installed program works
        run: |
          "$RUNNER_TEMP/ag/venv/bin/autogel" ladders NEB
          "$RUNNER_TEMP/ag/venv/bin/python" -c "from autogel import markers; n, _ = markers.update_library(); print('library update', n)"
      - name: Tests in the installed environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/ag/venv/bin/python" -m pip install -q pytest
          "$RUNNER_TEMP/ag/venv/bin/python" -m pytest -q
      - name: Uninstaller
        run: |
          "$RUNNER_TEMP/ag/Uninstall autogel.command"
          test ! -e "$RUNNER_TEMP/ag"
          test ! -e "$HOME/Applications/autogel.app"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run installer
        shell: cmd
        run: echo.| install_windows.bat -InstallDir "%RUNNER_TEMP%\ag" -NoShortcut -Yes
      - name: Installed program works
        shell: cmd
        run: '"%RUNNER_TEMP%\ag\venv\Scripts\autogel.exe" ladders NEB'
