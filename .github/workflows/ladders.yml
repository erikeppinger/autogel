name: ladder library check
# Runs the library consistency tests whenever a ladder file changes (e.g. a new ladder from an
# issue), so a typo can't reach users via "Update library from GitHub".
on:
  push:
    paths: ["autogel/ladders*.json", "autogel/markers.py", "tests/test_ladders.py"]
  pull_request:
    paths: ["autogel/ladders*.json", "autogel/markers.py", "tests/test_ladders.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q tests/test_ladders.py
